name: Eval Gate

on:
  pull_request:
    paths:
      - "skills/**"
      - "shared/**"

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  format:
    name: "Stage 1: Format Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval:format

  llm:
    name: "Stage 2: LLM Evaluation"
    needs: format
    if: always() && needs.format.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval:llm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-results
          path: eval/.cache/llm-results.json
          retention-days: 3

  e2e:
    name: "Stage 3: E2E Testing"
    needs: llm
    if: always() && needs.llm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: llm-results
          path: eval/.cache
      - run: npm run eval:e2e

  report:
    name: Post Results
    needs: [format, llm, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const icon = (result) => {
              if (result === 'success') return ':white_check_mark: Pass';
              if (result === 'failure') return ':x: Fail';
              if (result === 'skipped') return ':fast_forward: Skipped';
              return ':grey_question: Unknown';
            };

            const format = '${{ needs.format.result }}';
            const llm = '${{ needs.llm.result }}';
            const e2e = '${{ needs.e2e.result }}';

            const body = [
              `## Eval Results`,
              ``,
              `| Stage | Status |`,
              `|-------|--------|`,
              `| Format Validation | ${icon(format)} |`,
              `| LLM Evaluation | ${icon(llm)} |`,
              `| E2E Testing | ${icon(e2e)} |`,
              ``,
              `See [run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for full output.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## Eval Results';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  gate:
    name: Eval Gate Check
    needs: [format, llm, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          echo "Format: ${{ needs.format.result }}"
          echo "LLM: ${{ needs.llm.result }}"
          echo "E2E: ${{ needs.e2e.result }}"
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.llm.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::One or more eval stages failed"
            exit 1
          fi
          echo "All eval stages passed"
