name: Eval Gate

on:
  pull_request:
    paths:
      - "skills/**"
      - "eval/**"
      - "shared/**"

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  format:
    name: "Stage 1: Format Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: format
        run: |
          set +e
          output=$(npm run eval:format 2>&1)
          exitcode=$?
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          exit $exitcode
        continue-on-error: true
    outputs:
      result: ${{ steps.format.outputs.output }}
      exitcode: ${{ steps.format.outputs.exitcode }}

  llm:
    name: "Stage 2: LLM Evaluation"
    needs: format
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: llm
        run: |
          set +e
          output=$(npm run eval:llm 2>&1)
          exitcode=$?
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          exit $exitcode
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-results
          path: eval/.cache/llm-results.json
          retention-days: 3
    outputs:
      result: ${{ steps.llm.outputs.output }}
      exitcode: ${{ steps.llm.outputs.exitcode }}

  e2e:
    name: "Stage 3: E2E Testing"
    needs: llm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: llm-results
          path: eval/.cache
      - id: e2e
        run: |
          set +e
          output=$(npm run eval:e2e 2>&1)
          exitcode=$?
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          exit $exitcode
        continue-on-error: true
    outputs:
      result: ${{ steps.e2e.outputs.output }}
      exitcode: ${{ steps.e2e.outputs.exitcode }}

  report:
    name: Post Results
    needs: [format, llm, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const icon = (code) => code === '0' ? ':white_check_mark:' : ':x:';

            const format = {
              exitcode: '${{ needs.format.outputs.exitcode }}',
              result: `${{ needs.format.outputs.result }}`,
            };
            const llm = {
              exitcode: '${{ needs.llm.outputs.exitcode }}',
              result: `${{ needs.llm.outputs.result }}`,
            };
            const e2e = {
              exitcode: '${{ needs.e2e.outputs.exitcode }}',
              result: `${{ needs.e2e.outputs.result }}`,
            };

            const body = [
              `## Eval Results`,
              ``,
              `| Stage | Status |`,
              `|-------|--------|`,
              `| Format Validation | ${icon(format.exitcode)} |`,
              `| LLM Evaluation | ${icon(llm.exitcode)} |`,
              `| E2E Testing | ${icon(e2e.exitcode)} |`,
              ``,
              `<details><summary>Format Validation Output</summary>`,
              ``,
              '```',
              format.result || 'No output',
              '```',
              `</details>`,
              ``,
              `<details><summary>LLM Evaluation Output</summary>`,
              ``,
              '```',
              llm.result || 'No output',
              '```',
              `</details>`,
              ``,
              `<details><summary>E2E Testing Output</summary>`,
              ``,
              '```',
              e2e.result || 'No output',
              '```',
              `</details>`,
              ``,
              `---`,
              `*Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`,
            ].join('\n');

            // Upsert: find existing bot comment and update, or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## Eval Results';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  gate:
    name: Eval Gate Check
    needs: [format, llm, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          if [ "${{ needs.format.outputs.exitcode }}" != "0" ] || \
             [ "${{ needs.llm.outputs.exitcode }}" != "0" ] || \
             [ "${{ needs.e2e.outputs.exitcode }}" != "0" ]; then
            echo "::error::One or more eval stages failed"
            exit 1
          fi
          echo "All eval stages passed"
