name: Run Evals

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 8AM UTC
  push:
    branches:
      - trunk
      - "experiment/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  format:
    name: "Stage 1: Format Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval:format

  llm:
    name: "Stage 2: LLM Evaluation"
    needs: format
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval:llm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-results
          path: eval/.cache/llm-results.json
          retention-days: 7

  e2e:
    name: "Stage 3: E2E Testing"
    needs: llm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: llm-results
          path: eval/.cache
      - run: npm run eval:e2e

  open-regression-issue:
    name: Open Regression Issue
    needs: [format, llm, e2e]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const failedJobs = [];
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const job of jobs.data.jobs) {
              if (job.conclusion === 'failure') {
                failedJobs.push(job.name);
              }
            }

            const title = `[eval-regression] ${failedJobs.join(', ')} failed on ${context.sha.slice(0, 7)}`;
            const body = [
              `## Eval Regression`,
              ``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Commit:** ${context.sha}`,
              `**Branch:** ${context.ref}`,
              `**Failed stages:** ${failedJobs.join(', ')}`,
              ``,
              `Review the run logs for details on which scenarios or criteria failed.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['eval-regression'],
            });
