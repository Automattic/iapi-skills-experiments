name: Run Evals

on:
  schedule:
    - cron: "0 8 * * *" # Daily 8AM UTC
  push:
    branches:
      - trunk
      - "experiment/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  format:
    name: "Stage 1: Format Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval:format

  llm:
    name: "Stage 2: LLM Evaluation"
    needs: format
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval:llm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-results
          path: |
            eval/.cache/llm-results.json
            eval/.cache/eval-summary.json
          retention-days: 7

  e2e:
    name: "Stage 3: E2E Testing"
    needs: llm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: llm-results
          path: eval/.cache
      - run: npm run eval:e2e

  open-regression-issue:
    name: Open Regression Issue
    needs: [format, llm, e2e]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const failedJobs = [];
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const job of jobs.data.jobs) {
              if (job.conclusion === 'failure') {
                failedJobs.push(job.name);
              }
            }

            const failedStages = failedJobs.join(', ');

            // Check for an existing open eval-regression issue with the same failing stages.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'eval-regression',
              state: 'open',
              per_page: 20,
            });

            const duplicate = openIssues.find(issue =>
              issue.title.includes(failedStages)
            );

            if (duplicate) {
              // Append a comment with the new run info instead of opening a duplicate.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `**Still failing** on ${context.sha.slice(0, 7)} — [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
              core.info(`Duplicate detected — commented on #${duplicate.number}`);
              return;
            }

            const title = `[eval-regression] ${failedStages} failed on ${context.sha.slice(0, 7)}`;
            const body = [
              `## Eval Regression`,
              ``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Commit:** ${context.sha}`,
              `**Branch:** ${context.ref}`,
              `**Failed stages:** ${failedStages}`,
              ``,
              `Download the \`llm-results\` artifact from this run for structured failure data (\`eval-summary.json\`).`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['eval-regression'],
            });
