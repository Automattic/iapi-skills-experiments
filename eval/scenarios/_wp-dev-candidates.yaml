# Implemented Themes scenarios — full records

- name: themes-enqueue-assets
  description: Load a front-end stylesheet and script under a shared handle so WordPress emits their tags.
  difficulty: simple
  concepts: [wp_enqueue_scripts, wp_enqueue_style, wp_enqueue_script]
  source: dev.wordpress.org
  source_files:
    - https://developer.wordpress.org/themes/core-concepts/including-assets/
    - https://developer.wordpress.org/themes/classic-themes/
  prompt: |
    On my WordPress site's front-end pages, I want an actual stylesheet file and an actual script file to both be loaded — not just declared or reserved — under the shared handle `themes-frontend-assets`, so the browser receives their tags. Both files must have a real source URL so WordPress emits the `<link>` and `<script>` elements on every front-end page.
  acceptance:
    - On the front end, a stylesheet is enqueued (not merely registered) under the handle `themes-frontend-assets`, with a real source, so WordPress emits its `<link>` element.
    - On the front end, a script is enqueued (not merely registered) under the handle `themes-frontend-assets`, with a real source, so WordPress emits its `<script>` element.
    - Both assets are enqueued from a callback attached to the front-end asset-enqueueing hook (not the admin or login screens).
    - The enqueues require no theme artifact — they work from the plugin against whatever theme is active.

- name: themes-nav-menu-location
  description: Register a navigation-menu location with a translatable label on theme setup.
  difficulty: simple
  concepts: [register_nav_menus, after_setup_theme, nav-menu-location]
  source: dev.wordpress.org
  source_files:
    - https://developer.wordpress.org/reference/functions/register_nav_menus/
  prompt: |
    I want my plugin to make a navigation-menu location available — a named slot that a theme can assign a menu to — identified by the slug `primary`, with a human-readable, translatable label. The location should be registered early enough to be in place before the theme renders its templates.
  acceptance:
    - A navigation-menu location with the pinned slug is registered.
    - The registration runs on the theme-setup hook (so it is in place before templates render).
    - The location's label is wrapped for translation.
    - No theme template or menu-rendering call is required for the registration to be in effect.

- name: themes-sidebar-widget-area
  description: Register a sidebar / widget area with an id, translatable name, and widget/title wrappers.
  difficulty: simple
  concepts: [register_sidebar, widgets_init, widget-area]
  source: dev.wordpress.org
  source_files:
    - https://developer.wordpress.org/reference/functions/register_sidebar/
  prompt: |
    Make available a sidebar / widget area — a region where widgets can be placed — identified by the id `themes-sidebar-1` with the human-readable, translatable name `Theme Sidebar`, and provide markup that wraps each widget and each widget title so the output is properly structured.
  acceptance:
    - A sidebar / widget area with the pinned id and human-readable name is registered.
    - The registration runs on the widgets-initialization hook.
    - The registration supplies before/after wrappers for each widget and its title.
    - The widget area's name is wrapped for translation.

# === Area: Plugins ===

- name: taxonomy-register
  description: Register a `genre` taxonomy on posts, exposed via the REST API.
  difficulty: simple
  concepts: [register_taxonomy, show_in_rest, init-hook]
  source: dev.wordpress.org
  source_files:
    - https://developer.wordpress.org/plugins/taxonomies/working-with-custom-taxonomies/
    - https://developer.wordpress.org/reference/functions/register_taxonomy/
  prompt: |
    I want editors to be able to group and label my posts into a named set of terms — a "genre" classification (use the identifier `genre`) — and I want those genres reachable through my site's data API so other tools can read them.
  acceptance:
    - Registers the taxonomy on the `init` action hook (not before it).
    - The taxonomy is attached to the `post` object type.
    - "`public => true` and `show_in_rest => true` are both set."
    - The taxonomy identifier does not exceed 32 characters and uses only lowercase letters, dashes, and underscores.
    - "Labels (`name` / `singular_name`) are wrapped in `__()` for translation."

- name: post-meta-rest
  description: Register a `subtitle` post meta exposed in the REST API.
  difficulty: simple
  concepts: [register_post_meta, show_in_rest, init-hook]
  source: dev.wordpress.org
  source_files:
    - https://developer.wordpress.org/plugins/metadata/managing-post-metadata/
    - https://developer.wordpress.org/reference/functions/register_post_meta/
    - https://developer.wordpress.org/rest-api/extending-the-rest-api/modifying-responses/
  prompt: |
    I want to store an extra piece of information on each of my posts — a short subtitle, saved under the key `subtitle` — and have it available through my site's data API so other tools can read it back.
  acceptance:
    - Registers the post meta on the `init` action hook, targeting the core `post` type.
    - "`single => true` is set (the value is a single scalar, not an array)."
    - "`type` is set (e.g. `string`)."
    - "`show_in_rest => true` is set so the value surfaces in the REST API."
    - The meta key is public (no leading underscore), so it is exposed rather than protected.

- name: settings-register
  description: Register a `my_plugin_tagline` setting exposed in the REST API with a default.
  difficulty: simple
  concepts: [register_setting, show_in_rest, sanitize_callback]
  source: dev.wordpress.org
  source_files:
    - https://developer.wordpress.org/plugins/settings/settings-api/
    - https://developer.wordpress.org/plugins/settings/options-api/
    - https://developer.wordpress.org/reference/functions/register_setting/
  prompt: |
    I want a site-wide configurable option my editors can set — a tagline override stored under `my_plugin_tagline`, defaulting to `Hello world` — and I want it available through my site's data API.
  acceptance:
    - Registers the setting with `show_in_rest => true` so it is exposed in the REST API.
    - The setting is registered so that it surfaces in REST — on `init` or `rest_api_init` (NOT only on `admin_init`).
    - "`type` is set (e.g. `string`)."
    - A `default` is provided.
    - A `sanitize_callback` is provided.

- name: cron-event
  description: Schedule a recurring background task via WP-Cron, cleaned up on deactivation.
  difficulty: simple
  concepts: [wp_schedule_event, wp_next_scheduled, register_deactivation_hook]
  source: dev.wordpress.org
  source_files:
    - https://developer.wordpress.org/plugins/cron/
    - https://developer.wordpress.org/plugins/cron/scheduling-wp-cron-events/
    - https://developer.wordpress.org/plugins/cron/understanding-wp-cron-scheduling/
  prompt: |
    I want my plugin to run a recurring background task automatically — say a periodic cleanup that runs on a regular schedule — without me having to trigger it manually.
  acceptance:
    - Schedules the event via `wp_schedule_event()`, guarded by a `wp_next_scheduled()` check so it is not scheduled more than once.
    - The event is hooked to a named action with a callback that performs the task.
    - Uses a valid built-in recurrence (`hourly`) — no custom interval (which would require the `cron_schedules` filter).
    - Unschedules the event on plugin deactivation (`register_deactivation_hook` + `wp_unschedule_event()`, or `wp_clear_scheduled_hook()`).

- name: i18n-textdomain
  description: Make all user-facing plugin strings translation-ready with a consistent text domain.
  difficulty: simple
  concepts: [gettext, text-domain, i18n]
  source: dev.wordpress.org
  source_files:
    - https://developer.wordpress.org/plugins/internationalization/
    - https://developer.wordpress.org/plugins/internationalization/how-to-internationalize-your-plugin/
    - https://developer.wordpress.org/plugins/internationalization/localization/
  prompt: |
    I want all of my plugin's user-facing text to be ready to translate into other languages, so translators can localize it later.
  acceptance:
    - "User-facing strings are wrapped in a gettext function (`__()` / `_e()` / `esc_html__()`)."
    - The text domain is a literal string equal to the plugin slug.
    - A `Text Domain:` header is present in the plugin header.
    - No variable or constant is used as the text-domain argument, and no variable is used as the translatable-string argument (both must be literals).

- name: admin-menu-page
  description: Add a capability-gated admin settings page reachable from the dashboard.
  difficulty: simple
  concepts: [add_menu_page, admin_menu, capability]
  source: dev.wordpress.org
  source_files:
    - https://developer.wordpress.org/plugins/administration-menus/
    - https://developer.wordpress.org/plugins/administration-menus/top-level-menus/
    - https://developer.wordpress.org/plugins/administration-menus/sub-menus/
  prompt: |
    I want my plugin to add its own settings screen reachable from the WordPress dashboard, so administrators have a place to manage it.
  acceptance:
    - Registers the page via `add_menu_page()` (or `add_submenu_page()` / `add_options_page()`) on the `admin_menu` action hook.
    - A `capability` (e.g. `manage_options`) is set to gate access.
    - A `menu_slug` and a render callback are provided.
    - The render callback outputs escaped markup, and no output is produced outside the callback.

