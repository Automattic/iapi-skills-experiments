# WordPress-development candidate catalog
# Snapshot date: 2026-06-18
#
# This is the WordPress-development candidate catalog — distinct from the
# Interactivity-API catalog at eval/scenarios/_candidates.yaml. It covers
# every one of the 10 top-level developer.wordpress.org areas and records
# documentation provenance for the six implemented Plugins scenarios.
#
# Area → landing URL map (10 top-level areas):
#
#   Documentation (7):
#     Block Editor         https://developer.wordpress.org/block-editor/
#     Themes               https://developer.wordpress.org/themes/
#     Plugins              https://developer.wordpress.org/plugins/
#     Common APIs          https://developer.wordpress.org/apis/
#     Advanced Admin       https://developer.wordpress.org/advanced-administration/
#     Coding Standards     https://developer.wordpress.org/coding-standards/
#     WordPress Playground https://developer.wordpress.org/playground/wordpress-playground-resources/
#
#   API Reference (3):
#     Code Reference       https://developer.wordpress.org/reference/
#     REST API             https://developer.wordpress.org/rest-api/
#     WP-CLI Commands      https://developer.wordpress.org/cli/commands/
#
# Record shape mirrors _candidates.yaml. source: dev.wordpress.org distinguishes
# these entries from the iAPI catalog's source: docs (local Gutenberg checkout).
# source_files carries developer.wordpress.org URLs (not local paths).
# Full prompt + acceptance are included only for the six implemented Plugins
# scenarios; all other records are lighter stubs.

