# Implemented Agentic Workflows scenarios — full records

- name: wordpress-router-classify
  description: Classify a WordPress codebase and route it to the correct workflow/skill.
  difficulty: simple
  concepts: [routing, classification, orchestration]
  source: agent-skills
  source_files:
    - https://github.com/WordPress/agent-skills/tree/trunk/skills/wordpress-router
    - https://raw.githubusercontent.com/WordPress/agent-skills/trunk/skills/wordpress-router/SKILL.md
    - https://raw.githubusercontent.com/WordPress/agent-skills/trunk/skills/wordpress-router/references/decision-tree.md
  # agent-skills: wordpress-router
  # Harness dependency: no plugin deliverable — analysis/routing report graded statically by the judge
  prompt: |
    I have a WordPress project and I need you to tell me exactly what kind of WordPress work it is and which development workflow I should follow. Here is what I have: a repository that contains a block.json file, a src/ directory with edit.js and save.js, a package.json referencing @wordpress/scripts and @wordpress/blocks, and a build pipeline using npm run build. There is no functions.php, no style.css header, and no theme.json at the root. What type of WordPress project is this, which category from the WordPress router taxonomy does it fall into, and which specific workflow or skill should I use to continue developing it? Please give me your classification decision and justify it with the concrete signals you found.
  acceptance:
    - Identifies the project kind from the router's taxonomy — the report names the specific kind (e.g. wp-block-plugin, wp-plugin, wp-block-theme, wp-theme, wp-site, wp-core, or gutenberg) that best matches the described codebase.
    - Gives a clear, unambiguous routing decision — the report names the target workflow or skill (e.g. wp-block-development, wp-plugin-development, wp-block-themes) that should be used for this project.
    - Justifies the decision from concrete signals present in the described codebase — the justification references specific files or tooling clues (block.json, @wordpress/scripts, edit.js/save.js, or absence of functions.php/style.css/theme.json) rather than making a generic statement.
    - Covers the router's intent-based routing categories in the justification — the report demonstrates awareness of the distinction between block development, plugin development, theme development, and other taxonomy branches, explaining why this project falls into the selected category and not the alternatives.

- name: project-triage-report
  description: Deterministically inspect a WordPress repo and produce a structured triage report.
  difficulty: simple
  concepts: [triage, repo-inspection, structured-report]
  source: agent-skills
  source_files:
    - https://github.com/WordPress/agent-skills/tree/trunk/skills/wp-project-triage
    - https://raw.githubusercontent.com/WordPress/agent-skills/trunk/skills/wp-project-triage/SKILL.md
  # agent-skills: wp-project-triage
  # Harness dependency: no plugin deliverable — triage report graded statically by the judge on the produced structured output
  prompt: |
    I have a WordPress repository and I need a structured triage report before I start making changes. Here is what the repo looks like:

    - Root contains: `index.php` (plugin main file), `block.json`, `src/edit.js`, `src/save.js`, `composer.json`, `phpunit.xml`, `package.json` (with `@wordpress/scripts` and `@wordpress/blocks`), and a `build/` output directory.
    - The plugin header in `index.php` declares `Plugin Name: My Feature Plugin`, `Version: 1.2.0`, `Requires at least: 6.0`, `Tested up to: 6.5`, and `Requires PHP: 7.4`.
    - There is a `block.json` at the root referencing `"editorScript": "file:./build/index.js"`.
    - There is no `functions.php`, no `style.css` theme header, and no `theme.json` at the root.
    - `composer.json` lists `szepeviktor/phpstan-wordpress` under `require-dev`. A `vendor/` directory is present.
    - `phpunit.xml` is present; no `jest.config.js` or Playwright config found.
    - No `.wp-env.json` or `wp-env` dependency found in `package.json`.

    Please produce a structured triage report for this repository.
  acceptance:
    - The report includes a project inventory section that names the identified project kind (wp-block-plugin or equivalent) and lists the concrete signals used to reach that conclusion (block.json, @wordpress/scripts, edit.js/save.js, absence of functions.php/theme header).
    - "The report includes a findings or health section that covers tooling present (PHP: Composer + PHPStan; Node: @wordpress/scripts; Tests: PHPUnit present, wp-env absent, Jest absent) and notes any gaps or risks (e.g. no wp-env integration test environment, WordPress tested-up-to version vs. current)."
    - The report includes a prioritized next-actions section listing recommended steps in priority order, grounded in the signals found (for example, add wp-env for integration tests, update the Tested up to header, or run PHPStan).
    - All three sections — inventory, health/findings, and prioritized actions — are present and reference specific file-level signals from the described repository rather than making generic statements.

- name: plugin-directory-review
  description: Review a plugin against the WordPress.org Plugin Directory guidelines (GPL, naming, trademarks, freemium).
  difficulty: simple
  concepts: [plugin-directory-guidelines, compliance-review, gpl]
  source: agent-skills
  source_files:
    - https://github.com/WordPress/agent-skills/tree/trunk/skills/wp-plugin-directory-guidelines
    - https://raw.githubusercontent.com/WordPress/agent-skills/trunk/skills/wp-plugin-directory-guidelines/SKILL.md
    - https://developer.wordpress.org/plugins/wordpress-org/detailed-plugin-guidelines/
  # agent-skills: wp-plugin-directory-guidelines
  # Harness dependency: no plugin deliverable — compliance report graded statically by the judge on the produced findings
  prompt: |
    I want to submit my plugin to the WordPress.org Plugin Directory and I need a compliance review before I do. Here is what the plugin looks like:

    Plugin header (in `my-awesome-plugin.php`):
    ```
    Plugin Name: My Awesome Plugin for WooCommerce
    Plugin URI: https://example.com/my-awesome-plugin
    Description: Adds extra features to WooCommerce stores.
    Version: 1.0.0
    Author: Jane Dev
    License: GPL-2.0+
    License URI: https://www.gnu.org/licenses/gpl-2.0.html
    Text Domain: my-awesome-plugin
    ```

    Other details:
    - The plugin slug (directory name) is `my-awesome-plugin`.
    - All PHP source files contain readable, non-minified source code. No obfuscation tools are used.
    - A bundled third-party library (`vendor/charting-lib/chart.js`) carries an MIT license with its own `LICENSE` file.
    - The plugin optionally connects to `api.example.com` to fetch chart data. The connection fires only after the site admin enables it via an opt-in settings toggle; no data is sent on first activation.
    - On the plugin's admin settings page there is a persistent, non-dismissible banner that reads "Upgrade to Pro for more features!" and links to a paid add-on on an external site. The banner appears on every admin page load, not just the plugin's own settings screen.
    - The plugin readme.txt tags section contains 8 tags including several competitor plugin names used to attract search traffic.
    - The plugin does not lock any of its own features behind a paywall — all bundled functionality works without purchasing anything.
    - The plugin does not bundle any WordPress-default libraries (jQuery, etc.) — it uses `wp_enqueue_script` with WordPress-bundled handles.

    Please review this plugin against the WordPress.org Plugin Directory guidelines and report your compliance findings.
  acceptance:
    - The report checks GPL / licensing compliance (Guideline 1) and gives a pass/fail verdict with reasons — it must note the GPL-2.0+ header is present and that the bundled MIT library is GPL-compatible, resulting in a PASS for this category.
    - The report checks code readability / no obfuscation (Guideline 4) and gives a pass/fail verdict — the non-obfuscated, human-readable source must yield a PASS.
    - The report checks trialware / freemium restrictions (Guideline 5) and gives a pass/fail verdict — the plugin locking no features behind a paywall must yield a PASS for feature lockout, but the persistent non-dismissible upgrade banner visible on all admin pages must be flagged as a FAIL or WARN under the admin dashboard advertising rules (Guideline 11).
    - The report checks user consent for external connections (Guideline 7) and gives a pass/fail verdict — the opt-in settings toggle before any data is sent must yield a PASS.
    - The report checks plugin naming and trademark rules (Guideline 17) and gives a pass/fail verdict — the slug `my-awesome-plugin` is acceptable, but the report must note that the name includes `WooCommerce` (a trademark) after a connector word (`for`), which is permitted, and confirm the name is otherwise compliant.
    - The report checks readme tag compliance (Guideline 12) and gives a pass/fail verdict — 8 tags (exceeding the 5-tag limit) including competitor names must be flagged as a FAIL.
    - Each finding includes the guideline number or category name, a clear PASS/FAIL/WARN verdict, and a one-sentence reason grounded in the described plugin's specific details.

