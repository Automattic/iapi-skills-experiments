- name: wpds-component-ui
  description: Build a small, consistent admin/editor UI using WordPress Design System components from @wordpress/components rather than hand-rolled HTML/CSS.
  difficulty: simple
  concepts: [wpds, design-system, react-components, Panel, ToggleControl, Button]
  source: agent-skills
  source_files:
    - https://developer.wordpress.org/block-editor/reference-guides/components/
    - https://github.com/WordPress/agent-skills/tree/trunk/skills/wpds
