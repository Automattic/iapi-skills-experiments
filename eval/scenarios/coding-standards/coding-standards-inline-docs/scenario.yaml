name: coding-standards-inline-docs
description: Add a documentation comment to a small PHP function that formats a welcome message.
skills:
  - wordpress-development
prompt: |
  I have a small PHP function for my plugin that takes a user's display name and a greeting prefix and returns a formatted welcome message. The function works, but other developers (and future me) will need to understand it without reading the body. Please add a proper documentation comment above it that explains what it does, describes each input and the value it returns, and notes the plugin version it was introduced in — formatted the way it should be for this kind of project.
acceptance:
  - The doc block opens with a single-sentence summary line describing what the function does.
  - Each parameter has a `@param` entry giving its type and `$name` (one per parameter), in declaration order.
  - There is a `@return` entry stating the returned type (and a description where the type alone is ambiguous).
  - There is an `@since` tag using a three-digit version number (for example `@since 1.0.0`).
  - The doc block is a `/** ... */` block placed immediately above the function, with the tag descriptions aligned and formatted per the standard.
rubrics: []
