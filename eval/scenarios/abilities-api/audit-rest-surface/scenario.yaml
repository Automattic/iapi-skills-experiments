name: audit-rest-surface
description: Audit a plugin's REST surface and produce a structured report proposing which routes should become named abilities.
skills:
  - wordpress-development

prompt: |
  I have an existing WordPress plugin that exposes several REST API routes. I'd like you to audit its REST surface and produce a structured report that inventories all of the REST controllers and endpoints, identifies which routes are good candidates to expose as named, discoverable abilities, notes which ones should be deferred and why, and calls out any gaps or non-standard patterns you noticed. The report should give me a clear picture of what to prioritise so I know exactly what to tackle first.

acceptance:
  - The report contains a Controller Inventory section with a table enumerating at least one REST controller — each row includes the controller class or file, HTTP method, route, callback name, permission callback, and return type.
  - The report contains a proposed-abilities list where each entry includes the ability name, the backing controller or function, the capability gate, the annotations (readonly, destructive, or idempotent), and the implementation effort (S, M, or L).
  - Deferred or excluded registrations appear in a dedicated excluded or deferred section, each accompanied by a one-sentence deferral reason; abilities with no backing controller have a null backing and appear in a surfaced-gaps section.
  - The report contains a Notes and Surprises prose section that covers at least the capability-gate mechanism in use and any non-standard patterns found in the plugin.

rubrics: []
