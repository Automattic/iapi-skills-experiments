name: custom-command
description: Register a custom WP-CLI command that prints a pinned message to the terminal.
skills:
  - wordpress-development

prompt: |
  I want my WordPress plugin to add its own command-line command so I can run it from the terminal when managing the site. The command should be named `my-plugin hello` and, when run, it must print exactly the text `Hello from my-plugin` to the terminal output. The command should only be available when the plugin is active.

acceptance:
  - The plugin registers a custom WP-CLI command accessible as `wp my-plugin hello`.
  - Running `wp my-plugin hello` prints the text `Hello from my-plugin` to stdout.
  - The command is only available when the plugin is active.

rubrics: []
