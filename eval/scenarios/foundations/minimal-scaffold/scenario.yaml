name: minimal-scaffold
description: Build the smallest correctly-wired Interactivity API block.
skills:
  - wordpress-development

prompt: |
  I want the tiniest possible interactive block for WordPress — basically
  a "hello world" I can drop into a post to confirm the runtime is alive.

  When the block renders on the page, I want to see the text "Hello from iAPI"
  on screen. And once the runtime has picked the block up and finished
  setting it up on the client, I want to see "iapi-ready" logged to the
  browser console — just once per block instance, not every time the
  script file loads.

acceptance:
  - The literal text "Hello from iAPI" is visible on the page as soon as the server-rendered HTML arrives — before any client-side script runs.
  - The "iapi-ready" console log is emitted exactly once per block instance when the runtime finishes setting up that instance — it does not fire on every script load and does not fire again if the page is navigated softly.
  - The init callback runs once on mount per instance, not on every state change.

rubrics:
  - wp-interactivity-api-best-practices
