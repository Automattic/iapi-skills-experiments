name: block-bindings
description: Register a custom PHP data source that supplies a value to a block, under a pinned source name.
skills:
  - wordpress-development

prompt: |
  I want to connect a block's attribute to a value coming from the server using a custom data source registered under the specific name `my-plugin/greeting`. Please set up this custom source so that it supplies a value from PHP to a block, allowing editors to bind block attributes to that server-provided greeting value.

acceptance:
  - A custom block binding source is registered on the `init` hook.
  - The source name matches `/^[a-z0-9-]+\/[a-z0-9-]+$/` and equals the pinned name (`my-plugin/greeting`).
  - A value callback (`get_value_callback`) is provided that returns a non-empty string.
  - The source namespace matches the plugin's namespace.

rubrics: []
