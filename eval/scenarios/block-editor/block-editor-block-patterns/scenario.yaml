name: block-editor-block-patterns
description: Register a block pattern composed of multiple blocks as a reusable content template, under the pinned name `my-plugin/hero`.
skills:
  - wordpress-development

prompt: |
  I want to make a reusable content template available in the WordPress editor — a pre-built arrangement of blocks that editors can insert with a single click. Please register a block pattern named `my-plugin/hero` with a human-readable title, so it shows up in the pattern inserter and editors can use it to quickly add a hero-style section to their pages.

acceptance:
  - A block pattern is registered on the `init` hook under the pinned name `my-plugin/hero`.
  - The pattern has a human-readable title.
  - The pattern content is a non-empty string of block markup.
  - The registered pattern is listed by name at the block patterns REST endpoint when requested by an authenticated user.

rubrics: []
