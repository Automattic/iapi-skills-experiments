name: wpds-component-ui
description: Build a small, consistent admin/editor UI using WordPress Design System components from @wordpress/components rather than hand-rolled HTML/CSS.
skills:
  - wordpress-development

prompt: |
  I want to build a small settings panel for my WordPress plugin's block editor sidebar using the official WordPress component library — the same components the editor itself uses — so it looks consistent with the rest of the WordPress admin UI. Please build a React component that renders a settings panel with a labeled toggle (for example, enabling or disabling a feature) and a primary action button. Use the WordPress components from @wordpress/components (such as Panel, PanelBody, ToggleControl, and Button) rather than hand-rolling the controls with raw HTML and CSS.

acceptance:
  - The component imports Panel and/or PanelBody from `@wordpress/components` and renders at least one of them as the panel container.
  - The component imports ToggleControl from `@wordpress/components` and renders it with at least a `label` prop and a `checked` prop — no raw `<input type="checkbox">` is used for this control.
  - The component imports Button from `@wordpress/components` and renders it with `variant="primary"` — no raw `<button>` with hand-rolled primary CSS is used for this control.
  - All three controls (Panel/PanelBody, ToggleControl, Button) are imported from `@wordpress/components`, not from any other package or hand-written.
  - The component does not replace the ToggleControl or Button with raw HTML elements (`<input>`, `<button>`, `<div>`) styled to look like those controls.

rubrics: []
