name: privacy-data-exporter
description: Register a personal data exporter for GDPR compliance.
skills:
  - wordpress-development

prompt: |
  I want my plugin to participate in WordPress's built-in personal data export tool so that when a site administrator exports a user's data for privacy compliance, my plugin's data for that user is included in the export. Please register a personal data exporter that returns structured data about the user.

acceptance:
  - The exporter is registered via the `wp_privacy_personal_data_exporters` filter, adding an entry to the exporters array.
  - The registered entry includes a human-readable, translatable exporter name and a callback.
  - The exporter callback returns an array with a `data` key (array of items) and a `done` key (boolean).
  - Each item in `data` includes at least `group_id`, `group_label`, `item_id`, and a `data` array of name/value pairs.

rubrics: []
