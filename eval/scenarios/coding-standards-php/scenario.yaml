name: coding-standards-php
description: Write a small PHP helper that maps a status value to a friendly display label.
skills:
  - wordpress-development
prompt: |
  I'm building a small WordPress plugin and I need a little helper function in PHP. It should take a status value (like an order or post status) and return a short, friendly label for it — for example, turning a stored status into something I can show to a reader. If the status isn't one it recognizes, it should fall back to a sensible default label. Please write that function for me.
acceptance:
  - Comparisons place the constant or literal on the left-hand side (Yoda conditions), so an accidental single `=` assignment cannot pass silently.
  - Braces follow the WordPress brace style — opening brace on the same line as the statement, closing brace on its own line, and braces used even for single-statement blocks.
  - Spacing follows the WordPress PHP standard — spaces inside the parentheses of control structures and function calls that take arguments, and spaces around operators.
  - Identifiers use lowercase snake_case, and the function name is prefixed or namespaced to avoid collisions (not a bare generic name).
rubrics: []
