name: hook-lookup
description: Use the Code Reference to find all actions/filters fired during wp_head and document their parameters.
skills:
  - wordpress-development

prompt: |
  Using the WordPress reference docs, identify the action and filter hooks that are fired during the `wp_head` lifecycle point and document each hook's name and parameters. For each hook, note whether it is an action or a filter, and list its parameters and their types or signatures as described in the reference.

acceptance:
  - Names the relevant hooks fired during the `wp_head` lifecycle (e.g. `wp_head`, `wp_enqueue_scripts`, `wp_print_styles`, or others documented at developer.wordpress.org/reference/hooks/).
  - Documents each hook's type — whether it is an action or a filter.
  - Documents each hook's parameters and their types or signatures as described in the reference.
  - The documentation is grounded in the WordPress Code Reference (developer.wordpress.org/reference/) rather than invented or inferred without citation.

rubrics: []
